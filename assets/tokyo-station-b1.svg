okyo-2026/?item=souvenir-curly#station" target="_top" aria-label="採買03 Curly’s Croissant"><title>Curly’s Croissant</title><path d="M468.13333333333327,573.2L413.13333333333327,533.2" stroke="#a94732" stroke-width="2" /><circle cx="468.13333333333327" cy="573.2" r="5" fill="#a94732" stroke="white" stroke-width="2" /><circle cx="413.13333333333327" cy="533.2" r="20" fill="#a94732" /><text x="413.13333333333327" y="539.2" text-anchor="middle" font-size="22" style="fill:white" font-family="Lihsianti, KleeMap, serif">03</text></a><a href="https://shen780910-dot.github.io/tokyo-2026/?item=souvenir-ivorish#station" target="_top"><text x="50" y="1015.0" font-size="20" font-family="Lihsianti, KleeMap, serif">01 Ivorish MAISON</text></a><a href="https://shen780910-dot.github.io/tokyo-2026/?item=souvenir-abite#station" target="_top"><text x="50" y="1077.0" font-size="20" font-family="Lihsianti, KleeMap, serif">02 A Bite Coffee</text></a><a href="https://shen780910-dot.github.io/tokyo-2026/?item=souvenir-curly#station" target="_top"><text x="50" y="1139.0" font-size="20" font-family="Lihsianti, KleeMap, serif">03 Curly’s Croissant</text></a><text x="50" y="1291" font-size="20" font-family="Lihsianti, KleeMap, serif">依下方導覽走通道；搭電梯／電扶梯前確認樓層，不進列車月台。</text><a href="https://shen780910-dot.github.io/tokyo-2026/?floor=b1#station" target="_top"><text x="50" y="1331" font-size="20" font-family="Lihsianti, KleeMap, serif">回行程與樓層分頁 →</text></a><style>@font-face{font-family:Lihsianti;src:url(fonts/lihsianti-heading.woff?v=1.67)}@font-face{font-family:KleeMap;src:url(map-source-font-klee.ttf?v=1.67)}text{font-family:Lihsianti,KleeMap,serif}</style></svg>