<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" aria-label="01–03 → 04–06｜JR B1 上1F"><style>@font-face{font-family:Lihsianti;src:url(fonts/lihsianti-heading.woff?v=1.67)}text{font-family:Lihsianti,serif;fill:#293343}.head{font-size:30px}.main{font-size:26px}.sub{font-size:24px}</style><defs><marker id="arrow-b1" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a94732" stroke-width="2"/></marker></defs><rect x="1" y="1" width="718" height="638" fill="#f8f5ee" stroke="#ded6cd"/><text class="head" x="30" y="48">01–03 → 04–06｜JR B1 上1F</text><rect x="30" y="80" width="660" height="112" rx="8" fill="#e8e1cf" stroke="#b5b5a6"/><text class="main" x="52" y="118">JR B1・改札內</text><text class="sub" x="52" y="162">01 Ivorish → 02 A Bite → 03 Curly’s</text><path d="M360 200V228" stroke="#a94732" stroke-width="3" marker-end="url(#arrow-b1)"/><rect x="30" y="240" width="660" height="112" rx="8" fill="#e3e8df" stroke="#b5b5a6"/><text class="main" x="52" y="278">SQUARE ZERO附近</text><text class="sub" x="52" y="322">搭連通B1／1F電扶梯上樓；推車走電梯</text><path d="M360 360V388" stroke="#a94732" stroke-width="3" marker-end="url(#arrow-b1)"/><rect x="30" y="400" width="660" height="112" rx="8" fill="#dce5e8" stroke="#b5b5a6"/><text class="main" x="52" y="438">JR 1F・中央通路</text><text class="sub" x="52" y="482">先04 COCORIS → 05 Maple → 06 JAGA</text><text x="30" y="575" class="sub">留在JR改札內；不要搭往列車月台的樓梯。</text><text x="30" y="615" font-size="19">樓層銜接示意；以地圖店名與現場電梯指標核對。</text></svg>