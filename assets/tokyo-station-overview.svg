<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 807" role="img" aria-labelledby="guide-title guide-desc"><title id="guide-title">站區總覽</title><desc id="guide-desc">依下方指引。01→02→03→04→05→06→07→08→09→10→11→12→emmi→午餐→13→14→15→16→動漫街→17 Calbee＋。分三次寄放（10:15、11:45、15:00），均使用改札外置物櫃，每次拍下櫃號與位置；晚餐後回東京站，對照三張照片全部取回。06之後由一般JR八重洲北口出站；Gift、動漫街、Calbee皆在改札外。採買編號01～17；圖中櫃位點依官方圖，細線為標籤引線。</desc><defs><marker id="guide-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#a94732" stroke-width="1.3" /></marker></defs><rect width="720" height="807" fill="#eeeade" /><path d="M20 24Q360 17 700 25L697 785Q360 791 22 784Z" fill="none" stroke="#536377" stroke-width="1.3" /><text x="45.2" y="82.53" font-size="30" font-family="Lihsianti, KleeMap, serif" fill="#26312e">東京站・1F 站區總覽</text><text x="43.82" y="112.92" font-size="20" font-family="Lihsianti, KleeMap, serif" fill="#536377">保留官方JR閘門、大丸與Gift Palette的實際關係</text><svg class="official-plan" x="35" y="160" width="650" height="450.7662835249042" viewBox="0 0 1044 724" overflow="hidden"><image href="map-source-5e780beded5efd67.png?v=1.62" width="1044" height="724" /><g class="translated-zone" data-label="東京站一番街"><rect x="70.000" y="19.000" width="78.000" height="19.000" fill="#fff" /></g><g class="translated-zone" data-label="八重洲側"><rect x="771.000" y="53.000" width="131.000" height="35.000" fill="#ddd" /><text data-system="true" x="836.5" y="78.66" font-family="Lihsianti, KleeMap, serif" font-size="20" text-anchor="middle" fill="#333">八重洲側</text></g><g class="translated-zone" data-label="JR 高速巴士乘車處"><rect x="923.000" y="30.000" width="107.000" height="18.000" fill="#fff" /></g><g class="translated-zone" data-label="八重洲南口"><rect x="924.000" y="123.000" width="62.000" height="17.000" fill="#fff" /></g><g class="translated-zone" data-label="八重洲北口"><rect x="350.000" y="206.000" width="123.000" height="32.000" fill="#211a15" /><text data-system="true" x="411.5" y="229.69488" font-family="Lihsianti, KleeMap, serif" font-size="20" text-anchor="middle" fill="#fff">八重洲北口</text></g><g class="translated-zone" data-label="八重洲中央口"><rect x="599.000" y="208.000" width="77.000" height="19.000" fill="#fff" /></g><g class="translated-zone" data-label="新幹線驗票口內"><rect x="439.000" y="247.000" width="79.000" height="18.000" fill="#e7ce71" /></g><g class="translated-zone" data-label="新幹線驗票口內"><rect x="831.000" y="244.000" width="81.000" height="19.000" fill="#e7ce71" /></g><g class="translated-zone" data-label="東京伴手禮廣場"><rect x="326.000" y="341.000" width="157.000" height="26.000" fill="#fff" /><text data-system="true" x="404.5" y="361.01565714285715" font-family="Lihsianti, KleeMap, serif" font-size="20" text-anchor="middle" fill="#111">東京伴手禮廣場</text></g><g class="translated-zone" data-label="JR 驗票口內"><rect x="587.000" y="379.000" width="59.000" height="21.000" fill="#f1e7ad" /></g><g class="translated-zone" data-label="北|自|由|通|道"><rect x="215.000" y="422.000" width="17.000" height="74.000" fill="#fff" /></g><g class="translated-zone" data-label="丸之內|北口"><rect x="309.000" y="606.000" width="40.000" height="36.000" fill="#fff" /><text data-system="true" x="329.0" y="620.504" font-family="Lihsianti, KleeMap, serif" font-size="20" text-anchor="middle" fill="#111">丸之內</text><text data-system="true" x="329.0" y="635.8373333333333" font-family="Lihsianti, KleeMap, serif" font-size="20" text-anchor="middle" fill="#111">北口</text></g><g class="translated-zone" data-label="丸之內|中央口"><rect x="576.000" y="589.000" width="42.000" height="34.000" fill="#f1e7ad" /><text data-system="true" x="597.0" y="602.3292" font-family="Lihsianti, KleeMap, serif" font-size="20" text-anchor="middle" fill="#111">丸之內</text><text data-system="true" x="597.0" y="618.4291999999999" font-family="Lihsianti, KleeMap, serif" font-size="20" text-anchor="middle" fill="#111">中央口</text></g><g class="translated-zone" data-label="丸之內|南口"><rect x="960.000" y="607.000" width="39.000" height="34.000" fill="#fff" /></g><g class="translated-zone" data-label="丸之內側"><rect x="45.000" y="648.000" width="135.000" height="35.000" fill="#ddd" /><text data-system="true" x="112.5" y="673.66" font-family="Lihsianti, KleeMap, serif" font-size="20" text-anchor="middle" fill="#333">丸之內側</text></g></svg><text x="43.99" y="676.57" font-size="20" font-family="Lihsianti, KleeMap, serif" fill="#536377">先在JR內買完兩間，再找「八重洲北口」。</text><text x="43.99" y="704.51" font-size="20" font-family="Lihsianti, KleeMap, serif" fill="#536377">大丸與Gift Palette都在改札外；往丸之內找北自由通路。</text><a class="map-source-link" href="https://www.tokyoeki-1bangai.co.jp/tokyogiftpalette/" target="_blank" rel="noopener noreferrer"><rect x="526" y="706.7662835249042" width="147" height="44" fill="transparent" /><text x="554.36" y="732.36" font-size="20" font-family="Lihsianti, KleeMap, serif" fill="#536377">底圖來源 ↗</text></a><g class="map-floor-navigation" role="navigation" aria-label="樓層地圖切換"><a class="map-floor-switch" data-floor="okashi" href="https://shen780910-dot.github.io/tokyo-2026/?floor=okashi#station" aria-label="← 前一張：零食B1"><rect x="38" y="727" width="124" height="56" fill="transparent" /><text data-system="true" x="100" y="763" font-family="Lihsianti, KleeMap, serif" font-size="20" text-anchor="middle" fill="#536377">← 前一張</text></a><text data-system="true" x="620" y="763" font-family="Lihsianti, KleeMap, serif" font-size="20" text-anchor="middle" fill="#a5aaa5">01→…→12→emmi→午餐→13→…→16→動漫街→17 Calbee＋</text><a class="map-full-floor" href="https://shen780910-dot.github.io/tokyo-2026/assets/tokyo-station-overview.svg" target="_blank" rel="noopener noreferrer"><rect x="230" y="727" width="260" height="56" fill="transparent" /><text data-system="true" x="360" y="763" font-family="Lihsianti, KleeMap, serif" font-size="20" text-anchor="middle" fill="#536377">開啟完整樓層圖 ↗</text></a></g><style>@font-face{font-family:Lihsianti;src:url(fonts/lihsianti-heading.woff?v=1.66)}@font-face{font-family:KleeMap;src:url(map-source-font-klee.ttf?v=1.66)}text{font-family:Lihsianti,KleeMap,serif}</style></svg>