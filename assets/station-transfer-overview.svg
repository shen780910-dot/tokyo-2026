<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" role="img" aria-label="東京站採買｜樓層銜接總覽"><style>@font-face{font-family:Lihsianti;src:url(fonts/lihsianti-heading.woff?v=1.68)}text{font-family:Lihsianti,serif;fill:#293343}.head{font-size:30px}.main{font-size:26px}.sub{font-size:24px}</style><defs><marker id="arrow-overview" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a94732" stroke-width="2"/></marker></defs><rect x="1" y="1" width="718" height="638" fill="#f8f5ee" stroke="#ded6cd"/><text class="head" x="30" y="48">東京站採買｜樓層銜接總覽</text><rect x="30" y="80" width="660" height="112" rx="8" fill="#e8e1cf" stroke="#b5b5a6"/><text class="main" x="52" y="118">JR改札內</text><text class="sub" x="52" y="162">B1 01–03 ↑ 1F 04–06 → 八重洲北口出站</text><path d="M360 200V228" stroke="#a94732" stroke-width="3" marker-end="url(#arrow-overview)"/><rect x="30" y="240" width="660" height="112" rx="8" fill="#e3e8df" stroke="#b5b5a6"/><text class="main" x="52" y="278">大丸館內</text><text class="sub" x="52" y="322">1F 07–11 ↓ B1 12 ↑ 4F emmi → 午餐</text><path d="M360 360V388" stroke="#a94732" stroke-width="3" marker-end="url(#arrow-overview)"/><rect x="30" y="400" width="660" height="112" rx="8" fill="#dce5e8" stroke="#b5b5a6"/><text class="main" x="52" y="438">改札外</text><text class="sub" x="52" y="482">Gift 1F 13–16 ↓ 動漫B1 → 17 Calbee＋</text><text x="30" y="575" class="sub">此為樓層與順序示意；實際步行沿館內通道。</text><text x="30" y="615" font-size="19">樓層銜接示意；以地圖店名與現場電梯指標核對。</text></svg>